[project]
name = "bedhead"
version = "0.1.0"
description = "Bed Head - look presentable on video calls. P0 spike: Tier A mesh-aware retouch pipeline."
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-contrib-python>=4.9",
    "numpy>=1.26",
    "pyvirtualcam>=0.11",
]

[project.scripts]
bedhead = "bedhead.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bedhead"]
