name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check bedhead/ tests/ scripts/

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # OpenCV needs GLib and the GL provider before it can be imported on
      # headless Linux runners; install ahead of any pip/pytest step.
      - name: Install OpenCV system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libgles2 libgl1-mesa-dri

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  test-macos:
    name: pytest (macos-latest, py${{ matrix.python-version }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  package:
    # standalone binary artifact (macOS arm64); P2 clean-machine install gate
    name: pyinstaller binary (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the one-file binary
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[guard]" pyinstaller
          pyinstaller bedhead.spec --noconfirm

      - name: Clean-machine smoke (no venv, fresh HOME)
        run: env -i HOME=$(mktemp -d) PATH=/usr/bin:/bin ./dist/bedhead --version

      - uses: actions/upload-artifact@v4
        with:
          name: bedhead-macos-arm64
          path: dist/bedhead
